name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath build/ArgusMasterCAM.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Export Payload to IPA
        run: |
          mkdir -p ios/App/build/Payload
          cp -r ios/App/build/ArgusMasterCAM.xcarchive/Products/Applications/App.app ios/App/build/Payload/
          cd ios/App/build
          zip -r ArgusMasterCAM-debug.ipa Payload
          cd ../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArgusMasterCAM-debug.ipa
          path: ios/App/build/ArgusMasterCAM-debug.ipa
          retention-days: 30
